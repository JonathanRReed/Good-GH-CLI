name: Keep bun.lock in sync

# Dependabot's npm ecosystem does not maintain bun.lock, so a merged dependency
# PR leaves main with a package.json the lockfile no longer matches — which then
# breaks `bun install --frozen-lockfile` for everyone.
#
# This runs on main rather than on the pull request on purpose. A push made with
# GITHUB_TOKEN cannot trigger another workflow, so syncing on the PR branch moves
# the head to a commit CI will never run on, and the PR ends up with no checks at
# all. On main that is harmless: CI already passed on the change itself.
on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve dependencies
        run: bun install

      - name: Commit the lockfile if it drifted
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): sync bun.lock [skip ci]"
          git push
