name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test --timeout 30000

      - name: Build
        run: bun run build

      - name: Smoke test built artifact
        run: |
          bun dist/ggh.js --version
          bun dist/ggh.js --help > /dev/null

      - name: Enforce bundle size budget (400 KB)
        run: |
          SIZE=$(wc -c < dist/ggh.js)
          echo "Bundle size: $SIZE bytes"
          test "$SIZE" -le 400000
