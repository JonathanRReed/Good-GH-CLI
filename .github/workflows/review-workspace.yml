name: Review workspace

on:
  push:
    branches: [fix/main-completion]
    paths: [.github/workflows/review-workspace.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Export source and pinned test tools without credentials
        run: |
          mkdir -p .review-tools
          cp "$(command -v bun)" .review-tools/bun
          git rev-parse HEAD > .review-tools/source-sha
          tar --exclude=.git -czf "$RUNNER_TEMP/workspace.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-workspace
          path: ${{ runner.temp }}/workspace.tar.gz
          retention-days: 1
