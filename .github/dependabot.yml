version: 2

updates:
  # Runtime and build dependencies. The dependency surface is deliberately small
  # (commander and picocolors), so weekly is frequent enough to stay current
  # without generating noise.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Dev tooling moves together and is low risk; one PR instead of six.
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint does not support TS 7 yet, so a TS 7 bump breaks lint
      # while typecheck still passes. Remove this once it lands.
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        versions: [">=7.0.0"]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
